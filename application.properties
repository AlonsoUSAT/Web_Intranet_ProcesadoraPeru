# ═══════════════════════════════════════════════════
# PROCESADORA PERÚ S.A.C. — Backend Spring Boot
# application.properties
# ═══════════════════════════════════════════════════

# ── Servidor ──────────────────────────────────────
server.port=8080
# Escuchar en todas las interfaces (acceso desde red local)
server.address=0.0.0.0

# ── Base de Datos SQL Server ───────────────────────
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ProcesadoraBD;encrypt=false
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA / Hibernate ───────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── Spring Security — Deshabilitar completamente ──
# Los endpoints /api/** son públicos en esta etapa.
# La seguridad se implementará en la fase final.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# ── Logging ───────────────────────────────────────
logging.level.root=WARN
logging.level.com.procesadoraperu=INFO
